<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二流人预警</title>

    <!-- ===== Supabase + 登录系统（顺序不能乱）===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="style-auth.css">

    <style>
        :root {
            /* 高级国画风配色 - 青绿山水+故宫传统色 */
            --ink-black: #1a1a1a;
            --ink-gray: #4a4a4a;
            --ink-light: #8a8a8a;
            --verdigris: #5f9ea0;
            --azurite: #4a7c8c;
            --malachite: #5a8a6e;
            --mountain-green: #3d6b4f;
            --pale-celadon: #e8f4f0;
            --mist-white: #f7f5f0;
            --imperial-yellow: #d4a574;
            --cinnabar: #c93756;
            --ochre: #b87333;
            --indigo: #2c4f66;
            --clay: #9c8d7a;
            --rice-paper: #faf8f3;
            --scroll-beige: #f0ebe3;
            --border-ink: #d4cfc7;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif;
            background-color: var(--rice-paper);
            color: var(--ink-black);
            line-height: 1.8;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(95, 158, 160, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(90, 138, 110, 0.03) 0%, transparent 50%);
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 32px; }

        header {
            background: linear-gradient(180deg, var(--indigo) 0%, #1a3a4a 100%);
            border-radius: var(--radius-lg);
            padding: 40px 48px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-medium);
            position: relative; overflow: hidden;
            border: 1px solid rgba(212, 165, 116, 0.3);
        }

        header::before {
            content: "";
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23d4a574' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.6;
        }

        h1 {
            margin: 0 0 12px 0; font-size: 2.5rem;
            color: var(--imperial-yellow); font-weight: 700;
            letter-spacing: 0.2em; position: relative; z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-family: 'Noto Serif SC', serif;
        }

        .date-badge {
            background: rgba(212, 165, 116, 0.2);
            border: 1px solid rgba(212, 165, 116, 0.4);
            padding: 6px 16px; border-radius: var(--radius-sm);
            font-size: 1.1rem; font-weight: 600;
            color: var(--imperial-yellow); margin-left: 16px; letter-spacing: 0.1em;
        }

        p.subtitle {
            color: rgba(247, 245, 240, 0.8); font-size: 1rem; margin: 0;
            font-weight: 400; letter-spacing: 0.15em; position: relative; z-index: 1;
        }

        .date-selector {
            margin-top: 20px; display: flex; align-items: center; gap: 16px;
            position: relative; z-index: 1;
        }

        .date-selector label {
            color: rgba(247, 245, 240, 0.9); font-size: 0.9rem;
            font-weight: 500; letter-spacing: 0.1em;
        }

        .date-selector input {
            padding: 10px 16px;
            border: 1px solid rgba(212, 165, 116, 0.4);
            border-radius: var(--radius-sm);
            background-color: rgba(26, 58, 74, 0.6);
            color: var(--mist-white); font-size: 0.9rem;
            font-family: inherit; cursor: pointer; outline: none; letter-spacing: 0.05em;
        }

        .date-selector input:focus {
            border-color: var(--imperial-yellow);
            box-shadow: 0 0 0 2px rgba(212, 165, 116, 0.2);
        }

        .date-selector button {
            background: linear-gradient(180deg, var(--cinnabar) 0%, #a52a4a 100%);
            color: var(--mist-white); border: none; padding: 10px 24px;
            border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.1em;
            box-shadow: 0 4px 12px rgba(201, 55, 86, 0.3); font-family: inherit;
        }

        .date-selector button:hover {
            background: linear-gradient(180deg, #d64d6a 0%, var(--cinnabar) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(201, 55, 86, 0.4);
        }

        .input-card {
            background: var(--mist-white); border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft); padding: 24px; margin-bottom: 32px;
            border: 1px solid var(--border-ink); position: relative;
        }

        .input-card::before {
            content: ""; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid rgba(156, 141, 122, 0.1);
            border-radius: var(--radius-sm); pointer-events: none;
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--border-ink);
        }

        .card-title {
            font-weight: 700; color: var(--indigo); font-size: 1.1rem;
            display: flex; align-items: center; gap: 8px; letter-spacing: 0.1em;
        }

        .card-title::before { content: "🖋️"; font-size: 1.2rem; }

        textarea#dataInput {
            width: 100%; height: 120px; padding: 16px; box-sizing: border-box;
            border: 1px solid var(--border-ink); border-radius: var(--radius-sm);
            font-family: 'Noto Sans SC', sans-serif; font-size: 14px;
            background-color: var(--rice-paper); color: var(--ink-black);
            resize: vertical; transition: all 0.3s ease; line-height: 1.8; letter-spacing: 0.05em;
        }

        textarea#dataInput:focus {
            outline: none; border-color: var(--verdigris);
            box-shadow: 0 0 0 3px rgba(95, 158, 160, 0.1);
        }

        textarea#dataInput::placeholder { color: var(--ink-light); font-size: 13px; }

        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; padding: 0 8px;
        }

        .results-title {
            font-size: 1.3rem; font-weight: 700; color: var(--indigo);
            display: flex; align-items: center; gap: 10px; letter-spacing: 0.15em;
        }

        .results-title::before { content: "✈️"; font-size: 1.4rem; }

        .results-meta { display: flex; align-items: center; gap: 16px; }

        .count-badge {
            background: linear-gradient(180deg, var(--cinnabar) 0%, #a52a4a 100%);
            color: var(--mist-white); padding: 8px 20px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 700;
            box-shadow: 0 4px 12px rgba(201, 55, 86, 0.2); letter-spacing: 0.1em;
            border: 1px solid rgba(212, 165, 116, 0.3);
        }

        .export-btn {
            background: linear-gradient(180deg, var(--verdigris) 0%, var(--azurite) 100%);
            color: var(--mist-white); border: none; padding: 10px 24px;
            border-radius: 20px; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(74, 124, 140, 0.3); letter-spacing: 0.1em; font-family: inherit;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(74, 124, 140, 0.4);
            background: linear-gradient(180deg, #6aaeb0 0%, var(--verdigris) 100%);
        }

        .export-btn:disabled { background: var(--clay); cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.6; }
        .export-btn::before { content: "🖼️"; font-size: 1rem; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }

        .flight-card {
            background: var(--mist-white); border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft); overflow: hidden;
            border: 1px solid var(--border-ink);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; position: relative;
        }

        .flight-card::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--verdigris), var(--malachite));
            opacity: 0; transition: opacity 0.3s ease;
        }

        .flight-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-medium); border-color: var(--verdigris); }
        .flight-card:hover::after { opacity: 1; }

        .flight-card-header {
            padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-ink); position: relative;
            background: linear-gradient(180deg, var(--pale-celadon) 0%, var(--mist-white) 100%);
        }

        .flight-card-header.yellow {
            background: linear-gradient(180deg, #f5e6d3 0%, var(--mist-white) 100%);
            border-bottom-color: var(--imperial-yellow);
        }

        .flight-card-header.yellow .airline-tag { background: var(--imperial-yellow); color: var(--ink-black); }

        .flight-card-header.orange {
            background: linear-gradient(180deg, #e8d5c4 0%, var(--mist-white) 100%);
            border-bottom-color: var(--ochre);
        }

        .flight-card-header.orange .airline-tag { background: var(--ochre); color: var(--mist-white); }

        .flight-info-left { display: flex; align-items: center; gap: 10px; }

        .airline-tag {
            background: var(--verdigris); padding: 4px 12px; border-radius: var(--radius-sm);
            font-size: 0.75rem; font-weight: 700; color: var(--mist-white);
            letter-spacing: 0.05em; border: 1px solid rgba(0,0,0,0.1);
        }

        .flight-number {
            font-size: 1.2rem; font-weight: 800; color: var(--ink-black);
            letter-spacing: 0.05em; font-family: 'Noto Sans SC', sans-serif;
        }

        .aircraft-type {
            background: rgba(156, 141, 122, 0.15); padding: 4px 12px; border-radius: var(--radius-sm);
            font-size: 0.85rem; font-weight: 700; color: var(--ink-gray);
            border: 1px solid var(--border-ink); font-family: 'Noto Sans SC', sans-serif;
        }

        .flight-card-body { padding: 20px; display: flex; gap: 20px; align-items: center; flex: 1; }

        .flight-details { flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .detail-row { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--ink-gray); }

        .detail-label { color: var(--ink-light); font-size: 0.8rem; min-width: 40px; letter-spacing: 0.1em; }

        .detail-value { font-weight: 600; color: var(--ink-black); font-family: 'Noto Sans SC', sans-serif; }

        .highlight {
            background: linear-gradient(180deg, rgba(201, 55, 86, 0.1) 0%, rgba(201, 55, 86, 0.05) 100%);
            padding: 2px 10px; border-radius: var(--radius-sm); color: var(--cinnabar);
            font-weight: 700; border: 1px solid rgba(201, 55, 86, 0.2);
        }

        .livery-tag {
            display: inline-flex; align-items: center;
            background: linear-gradient(180deg, rgba(90, 138, 110, 0.15) 0%, rgba(90, 138, 110, 0.05) 100%);
            color: var(--mountain-green); border: 1px solid rgba(90, 138, 110, 0.3);
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
            margin-top: 6px; width: fit-content; letter-spacing: 0.05em;
        }

        .livery-tag::before { content: "🎨"; margin-right: 6px; }

        .flight-image-container {
            width: 140px; height: 95px; border-radius: var(--radius-sm);
            overflow: hidden; background: var(--scroll-beige); border: 1px solid var(--border-ink);
            flex-shrink: 0; position: relative;
        }

        .flight-image-container::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.05) 100%);
            pointer-events: none; z-index: 1;
        }

        .livery-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .flight-card:hover .livery-image { transform: scale(1.08); }

        .no-image {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            color: var(--ink-light); font-size: 0.75rem; text-align: center; padding: 8px; font-style: italic;
        }

        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--ink-gray);
            background: var(--mist-white); border-radius: var(--radius-md);
            box-shadow: var(--shadow-soft); border: 2px dashed var(--border-ink); grid-column: 1 / -1;
        }

        .empty-state div:first-child { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
        .empty-state div:nth-child(2) { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--indigo); letter-spacing: 0.1em; }
        .empty-state div:nth-child(3) { font-size: 0.9rem; color: var(--ink-light); }

        .toast {
            position: fixed; bottom: 32px; right: 32px;
            background: var(--indigo); color: var(--mist-white);
            padding: 16px 28px; border-radius: var(--radius-md);
            box-shadow: var(--shadow-medium); font-weight: 600; font-size: 0.9rem;
            z-index: 9999; opacity: 0; transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.1em; border: 1px solid rgba(212, 165, 116, 0.3);
        }

        .toast.show { opacity: 1; transform: translateY(0); }

        .export-container { background: var(--rice-paper); padding: 60px; border-radius: var(--radius-lg); box-shadow: 0 20px 60px rgba(0,0,0,0.15); }

        .export-header { text-align: center; margin-bottom: 40px; padding-bottom: 30px; border-bottom: 3px double var(--border-ink); }

        .export-title { font-size: 2.8rem; color: var(--indigo); font-weight: 700; letter-spacing: 0.3em; margin-bottom: 12px; font-family: 'Noto Serif SC', serif; }

        .export-subtitle { font-size: 1rem; color: var(--ink-gray); letter-spacing: 0.2em; }

        .export-date {
            display: inline-block; background: var(--pale-celadon); padding: 8px 24px;
            border-radius: 20px; margin-top: 16px; font-size: 1.1rem; color: var(--azurite);
            font-weight: 600; border: 1px solid var(--verdigris);
        }

        .export-footer { text-align: center; margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--border-ink); color: var(--ink-light); font-size: 0.85rem; letter-spacing: 0.15em; }

        .hide-for-screenshot { display: none !important; }
        .screenshot-only { display: none; }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; }
            header { padding: 28px; }
            h1 { font-size: 1.8rem; }
            .export-container { padding: 30px; }
        }
    </style>
<base target="_blank">
</head>
<body>

<!-- ============================================== -->
<!-- 登录界面（最上层遮罩，未登录时显示） -->
<!-- ============================================== -->
<div id="login-overlay">
    <div class="login-card">
        <div class="login-header">
            <h2 id="login-title">二流人预警</h2>
            <p>请登录后使用系统</p>
        </div>
        <!-- ⚠️ 关键：必须是普通 div，不能是 <form>，否则回车/点击会触发默认提交 → 打开新页面 -->
        <div class="login-form" id="login-form">
            <input type="email" id="login-email" placeholder="邮箱地址" autocomplete="email">
            <input type="password" id="login-password" placeholder="密码（至少6位）" autocomplete="current-password">
            <div class="login-msg" id="login-message"></div>
            <!-- ⚠️ 关键：onclick 必须写 return，handleAuth() 末尾 return false 阻止跳转 -->
            <button type="button" class="login-btn" id="login-submit" onclick="return handleAuth()">登录</button>
            <button type="button" class="login-toggle" id="login-toggle" onclick="return toggleMode()">没有账号？去注册</button>
        </div>
    </div>
</div>

<!-- 退出按钮（登录后右上角显示） -->
<button class="logout-btn" onclick="return logout()" style="display:none;" id="logoutBtn">退出</button>

<!-- ============================================== -->
<!-- 主应用内容（登录后显示） -->
<!-- ============================================== -->
<div id="app-content" style="display:none;">
<div class="container" id="mainContainer">
    <header id="mainHeader">
        <h1>二流人预警系统<span class="date-badge" id="dateDisplay">20260403</span></h1>
        <p class="subtitle">juanxukuai_77 | 专业航班彩绘识别</p>
        <div class="date-selector">
            <label for="datePicker">选择日期：</label>
            <input type="date" id="datePicker">
            <button id="confirmDateBtn">确认日期</button>
        </div>
    </header>

    <!-- 输入区域 -->
    <section class="input-card" id="dataCard">
        <div class="card-header">
            <span class="card-title">原始数据输入</span>
        </div>
        <textarea id="dataInput" placeholder="在此粘贴航班数据（格式示例：CA1234 B1234 B737 14:30）"></textarea>
    </section>

    <!-- 结果区域 -->
    <section class="results-section" id="resultCard">
        <div class="results-header">
            <span class="results-title">航班彩绘识别结果</span>
            <div class="results-meta">
                <span id="resultCount" class="count-badge">0 条</span>
                <button id="exportImageBtn" class="export-btn" disabled>导出图片</button>
            </div>
        </div>
        <div id="cardsContainer" class="cards-grid">
            <div class="empty-state">
                <div>📭</div>
                <div>暂无匹配的航班数据</div>
                <div>请在上方输入框粘贴航班数据</div>
            </div>
        </div>
    </section>
</div>

<!-- 导出专用容器（平时隐藏） -->
<div id="exportWrapper" class="screenshot-only" style="position: fixed; left: -9999px; top: 0;">
    <div class="export-container" id="exportContent">
        <div class="export-header">
            <div class="export-title">二流人预警系统</div>
            <div class="export-subtitle">专业航班彩绘识别 · juanxukuai_77</div>
            <div class="export-date" id="exportDate">2026年04月03日</div>
        </div>
        <div id="exportCardsContainer" class="cards-grid" style="grid-template-columns: repeat(2, 1fr);">
            <!-- 卡片内容将复制到这里 -->
        </div>
        <div class="export-footer">
            Powered by juanxukuai_77
        </div>
    </div>
</div>

<!-- 提示弹窗 -->
<div class="toast" id="toast">操作成功！</div>
</div><!-- /app-content -->

    `.trim();

    const AIRCRAFT_TYPE_CONFIG = `
B733
B734
B737
B38M
B744
B748
B752
B762
B763
B77L
B77W
B788
B789
A346
C909
C919
AN124
    `.trim();

    let tailLiveryMap = new Map();
    let typeSet = new Set();
    let currentResults = [];

    const dataInput = document.getElementById('dataInput');
    const cardsContainer = document.getElementById('cardsContainer');
    const resultCount = document.getElementById('resultCount');
    const exportImageBtn = document.getElementById('exportImageBtn');
    const dataCard = document.getElementById('dataCard');
    const datePicker = document.getElementById('datePicker');
    const confirmDateBtn = document.getElementById('confirmDateBtn');
    const dateDisplay = document.getElementById('dateDisplay');
    const toast = document.getElementById('toast');
    const exportWrapper = document.getElementById('exportWrapper');
    const exportContent = document.getElementById('exportContent');
    const exportCardsContainer = document.getElementById('exportCardsContainer');
    const exportDate = document.getElementById('exportDate');

    let currentSelectedDate;

    function initDefaultDate() {
        const currentDate = new Date();
        currentDate.setDate(currentDate.getDate() + 1);
        currentSelectedDate = currentDate;
        updateDateDisplay(currentSelectedDate);
        const yyyy = currentDate.getFullYear();
        const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
        const dd = String(currentDate.getDate()).padStart(2, '0');
        datePicker.value = `${yyyy}-${mm}-${dd}`;
    }

    function updateDateDisplay(date) {
        const formattedDate = `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}`;
        dateDisplay.textContent = formattedDate;
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        exportDate.textContent = `${year}年${String(month).padStart(2, '0')}月${String(day).padStart(2, '0')}日`;
        window.exportFileName = `二流人预警${formattedDate}.png`;
    }

    confirmDateBtn.addEventListener('click', () => {
        if (!datePicker.value) { showToast('请选择日期！'); return; }
        const selectedDate = new Date(datePicker.value);
        if (isNaN(selectedDate.getTime())) { showToast('日期格式错误！'); return; }
        currentSelectedDate = selectedDate;
        updateDateDisplay(selectedDate);
        showToast(`日期已更新：${datePicker.value}`);
    });

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    // 退出按钮由 auth.js 直接控制，这里不需要额外逻辑

    window.addEventListener('load', () => {
        initDefaultDate();
        buildDictionaries();
        processData();
    });

    dataInput.addEventListener('input', processData);
    exportImageBtn.addEventListener('click', exportTableAsImage);

    function buildDictionaries() {
        tailLiveryMap.clear();
        TAIL_LIVERY_CONFIG.split('\n').forEach(line => {
            line = line.trim();
            if (!line) return;
            const sp = line.indexOf(' ');
            const key = sp === -1 ? line : line.slice(0, sp);
            const val = sp === -1 ? '' : line.slice(sp+1).trim();
            tailLiveryMap.set(key.toUpperCase(), val);
        });

        typeSet.clear();
        AIRCRAFT_TYPE_CONFIG.split('\n').forEach(line => {
            line = line.trim().toUpperCase();
            if (line) typeSet.add(line);
        });
    }

    function processData() {
        const lines = dataInput.value.split('\n');
        const result = [];

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            const parts = line.split(/\s+/);
            const flight = parts[0] || '-';
            const tail  = parts[1] || '-';
            const type  = parts[2] || '-';
            const time  = parts[3] || '-';

            const hasLivery = tailLiveryMap.has(tail.toUpperCase());
            const hasType   = typeSet.has(type.toUpperCase());

            if (hasLivery || hasType) {
                result.push({
                    flight: flight,
                    tail: tail,
                    type: type,
                    time: time,
                    livery: tailLiveryMap.get(tail.toUpperCase()) || '',
                    hasLivery: hasLivery,
                    hasType: hasType
                });
            }
        });

        currentResults = result;
        renderCards(result);
        resultCount.textContent = `${result.length} 条`;
        exportImageBtn.disabled = result.length === 0;
    }

    function renderCards(data) {
        if (data.length === 0) {
            cardsContainer.innerHTML = `
                <div class="empty-state">
                    <div>📭</div>
                    <div>暂无匹配的航班数据</div>
                    <div>请在上方输入框粘贴航班数据</div>
                </div>
            `;
            return;
        }
        cardsContainer.innerHTML = generateCardsHTML(data);
    }

    function generateCardsHTML(data, isExport = false) {
        let cardsHtml = '';
        data.forEach((item, index) => {
            const tailUpper = item.tail.toUpperCase();
            const imagePath = `images/${tailUpper}.jpg`;
            let headerClass = '';
            if (item.hasLivery && item.hasType) { headerClass = 'orange'; }
            else if (item.hasLivery) { headerClass = 'yellow'; }

            const airline = item.flight.substring(0, 2);
            const airlineNames = {
                'CA': '国航', 'CZ': '南航', 'MU': '东航', '3U': '川航',
                'MF': '厦航', 'HU': '海航', 'ZH': '深航', '9C': '春秋',
                'HO': '吉祥', 'GJ': '长龙', 'JD': '首都航', '8L': '祥鹏',
                'NS': '河北航', 'SC': '山航', 'BK': '奥凯', 'EU': '成都',
                'DZ': '东海', 'QW': '青岛', 'RY': '江西', 'G5': '华夏',
                'Y8': '金鹏', 'CF': '邮政', 'CI': '华航', 'BR': '长荣',
                'OM': '蒙古', 'ET': '埃塞', 'QR': '卡航', 'EK': '阿联酋',
                'SQ': '新航', 'CX': '国泰', 'LH': '汉莎', 'AF': '法航',
                'BA': '英航', 'UA': '美联', 'AA': '美航', 'DL': '达美',
                'JL': '日航', 'NH': '全日空', 'OZ': '韩亚', 'KE': '大韩',
                'TK': '土航', 'SV': '沙特', 'EY': '阿提哈德', 'W5': '马汉',
                'SU': '俄航', 'UN': '联航', 'N4': '顺丰', 'O3': '顺丰',
                'GI': '天货', 'YG': '圆通', 'HT': '中通', 'JG': '京东',
                'SE': '欧货', '19': '中州', 'C0': '西北货', 'CO': '西北货', '03': '顺丰', '30': '川航',
            };
            const airlineName = airlineNames[airline] || airline;

            cardsHtml += `
                <div class="flight-card">
                    <div class="flight-card-header ${headerClass}">
                        <div class="flight-info-left">
                            <span class="airline-tag">${airlineName}</span>
                            <span class="flight-number">${item.flight}</span>
                        </div>
                        <span class="aircraft-type">${item.type}</span>
                    </div>
                    <div class="flight-card-body">
                        <div class="flight-details">
                            <div class="detail-row">
                                <span class="detail-label">机号</span>
                                <span class="detail-value ${item.hasLivery ? 'highlight' : ''}">${item.tail}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">时间</span>
                                <span class="detail-value">${item.time}</span>
                            </div>
                            ${item.livery ? `<div class="livery-tag">${item.livery}</div>` : ''}
                        </div>
                        <div class="flight-image-container">
                            <img
                                src="${imagePath}"
                                class="livery-image"
                                alt="${tailUpper}"
                                onerror="this.parentNode.innerHTML='<div class=\\'no-image\\'>暂无图片</div>'"
                            >
                        </div>
                    </div>
                </div>
            `;
        });
        return cardsHtml;
    }

    function exportTableAsImage() {
        if (currentResults.length === 0) return;
        dataCard.classList.add('hide-for-screenshot');
        exportCardsContainer.innerHTML = generateCardsHTML(currentResults, true);
        exportWrapper.style.display = 'block';
        exportWrapper.style.position = 'fixed';
        exportWrapper.style.left = '0';
        exportWrapper.style.top = '0';
        exportWrapper.style.width = '100%';
        exportWrapper.style.height = '100%';
        exportWrapper.style.zIndex = '-1';
        exportWrapper.style.opacity = '0';

        setTimeout(() => {
            html2canvas(exportContent, {
                useCORS: true,
                allowTaint: true,
                scale: 3,
                logging: false,
                backgroundColor: '#faf8f3',
                width: exportContent.offsetWidth,
                height: exportContent.offsetHeight,
                windowWidth: exportContent.offsetWidth,
                windowHeight: exportContent.offsetHeight
            }).then(canvas => {
                dataCard.classList.remove('hide-for-screenshot');
                exportWrapper.style.display = 'none';
                exportWrapper.style.position = 'fixed';
                exportWrapper.style.left = '-9999px';
                const link = document.createElement('a');
                link.download = window.exportFileName || '二流人预警.png';
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                showToast('高清图片导出成功！');
            }).catch(error => {
                dataCard.classList.remove('hide-for-screenshot');
                exportWrapper.style.display = 'none';
                console.error('截图失败：', error);
                showToast('图片导出失败，请重试！');
            });
        }, 100);
    }
</script>
