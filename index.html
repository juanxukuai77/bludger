<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二流人预警</title>
    <style>
        :root {
            /* 浅色背景系统，提高可读性 */
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e2e8f0;
            /* 边框色适配浅色 */
            --border-color: #94a3b8;
            /* 强调色适配浅色 */
            --accent-primary: #0284c7;
            --accent-secondary: #7c3aed;
            --accent-glow: rgba(2, 132, 199, 0.2);
            /* 文字色适配浅色，提高对比度 */
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-tertiary: #64748b;
            /* 高亮背景适配浅色 */
            --highlight-bg: #bae6fd;
            /* 成功色适配浅色 */
            --success-color: #059669;
            --success-dark: #047857;
            
            /* 阴影适配浅色 */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            padding: 0;
            margin: 0;
            /* 浅色背景纹理 */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(2, 132, 199, 0.05) 0%, transparent 25%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.05) 0%, transparent 25%);
            font-size: 18px; /* 全局基础字号调大 */
        }

        .container { 
            max-width: 1400px; /* 加宽容器以容纳图片列 */
            margin: 0 auto; 
            padding: 32px; /* 加大内边距 */
        }

        header { 
            text-align: center; 
            margin-bottom: 40px; /* 加大间距 */
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }
        
        header::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px; /* 加宽渐变线 */
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
        }
        
        h1 { 
            margin: 0 0 12px 0; 
            font-size: 3rem; /* 大幅调大标题字号 */
            color: var(--text-primary);
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 8px var(--accent-glow);
        }
        
        h1 .date-suffix {
            font-size: 2rem; /* 调大日期字号 */
            opacity: 0.9;
            margin-left: 12px;
            text-shadow: 0 0 6px var(--accent-glow);
        }
        
        h1::after {
            content: "™";
            font-size: 1.2rem; /* 调大小标 */
            opacity: 0.7;
            margin-left: 6px;
        }
        
        p.subtitle { 
            color: var(--text-secondary); 
            font-size: 1.2rem; /* 调大副标题字号 */
            margin: 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 32px; /* 加大内边距 */
            margin-bottom: 32px; /* 加大间距 */
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .card-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 20px; /* 加大间距 */
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }
        
        .card-title { 
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.6rem; /* 调大卡片标题字号 */
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .card-title::before {
            content: "✈";
            font-size: 1.8rem; /* 调大图标字号 */
            color: var(--accent-primary);
            text-shadow: 0 0 8px var(--accent-glow);
        }

        textarea#dataInput {
            width: 100%; 
            height: 180px; /* 加高输入框 */
            padding: 20px; /* 加大内边距 */
            box-sizing: border-box; 
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm); 
            font-family: 'JetBrains Mono', 'Consolas', monospace; 
            font-size: 18px; /* 调大输入框字号 */
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            resize: vertical;
            transition: all 0.2s ease;
            line-height: 1.8;
        }
        
        textarea#dataInput:focus { 
            outline: none; 
            border-color: var(--accent-primary); 
            background-color: var(--bg-secondary);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        
        textarea#dataInput::placeholder {
            color: var(--text-tertiary);
            font-style: italic;
            font-size: 16px;
            opacity: 0.9;
        }
        
        /* 浅色风格表格样式 */
        .result-table { 
            width: 100%; 
            border-collapse: separate;
            border-spacing: 0;
            font-size: 18px; /* 调大表格字号 */
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
        }
        
        .result-table th {
            text-align: left; 
            padding: 20px 24px; /* 加大内边距 */
            background: linear-gradient(180deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
            color: var(--accent-primary); 
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 16px; /* 调大表头字号 */
        }
        
        .result-table th:not(:last-child)::after {
            content: "";
            position: absolute;
            right: 0;
            top: 20px;
            height: 30px; /* 加高分隔线 */
            width: 2px;
            background-color: var(--border-color);
        }
        
        .result-table td { 
            padding: 20px 24px; /* 加大内边距 */
            border-bottom: 2px solid var(--border-color);
            vertical-align: middle; 
            transition: background-color 0.2s ease;
            color: var(--text-secondary);
            font-weight: 600; /* 加粗单元格文字 */
        }
        
        .result-table tr:last-child td {
            border-bottom: none;
        }
        
        /* 浅色风格行悬停 */
        .result-table tr:hover td { 
            background-color: rgba(2, 132, 199, 0.1);
            color: var(--text-primary);
        }
        
        /* 浅色风格标签 */
        .livery-tag {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.1) 0%, rgba(2, 132, 199, 0.1) 100%); 
            color: var(--accent-primary);
            border: 2px solid rgba(2, 132, 199, 0.4);
            padding: 8px 16px; /* 加大标签 */
            border-radius: var(--radius-full);
            font-size: 16px; /* 调大标签字号 */
            font-weight: 600;
            margin-right: 10px; 
            margin-bottom: 6px;
            gap: 6px;
        }
        
        .livery-tag::before {
            content: "🎨";
            font-size: 14px;
            filter: drop-shadow(0 0 3px var(--accent-primary));
        }
        
        /* 浅色风格高亮 */
        .highlight {
            background: linear-gradient(120deg, rgba(14, 165, 233, 0.2) 0%, rgba(2, 132, 199, 0.2) 100%);
            border-radius: 6px; 
            padding: 4px 8px; /* 加大高亮区域 */
            font-weight: 700;
            color: var(--accent-primary);
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.1);
            border: 2px solid rgba(2, 132, 199, 0.3);
        }

        /* 浅色风格计数徽章 */
        .count-badge {
            background: linear-gradient(135deg, var(--accent-secondary) 0%, var(--accent-primary) 100%); 
            color: white;
            padding: 8px 18px; /* 加大徽章 */
            border-radius: var(--radius-full); 
            font-size: 1.1rem; /* 调大字号 */
            font-weight: 700;
            margin-right: 15px;
            box-shadow: var(--shadow-md);
            text-shadow: 0 0 4px rgba(0,0,0,0.3);
        }

        .empty-state { 
            text-align: center; 
            padding: 80px 20px; /* 加大空状态区域 */
            color: var(--text-tertiary); 
            font-style: italic;
            background-color: rgba(226, 232, 240, 0.8);
            border-radius: var(--radius-sm);
            border: 2px dashed var(--border-color);
        }
        
        .empty-state div:first-child {
            font-size: 4rem; /* 调大图标 */
            margin-bottom: 20px;
            color: var(--accent-primary);
            filter: drop-shadow(0 0 8px var(--accent-glow));
            opacity: 0.9;
        }
        
        .empty-state div:nth-child(2) {
            font-size: 1.3rem; /* 调大提示文字 */
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .empty-state div:nth-child(3) {
            font-size: 1.1rem; /* 调大说明文字 */
            font-weight: 500;
        }
        
        /* 浅色风格导出按钮 */
        .export-btn {
            background: linear-gradient(135deg, var(--success-color) 0%, var(--success-dark) 100%);
            color: white; /* 浅色按钮文字 */
            border: none;
            padding: 12px 30px; /* 加大按钮 */
            border-radius: var(--radius-full);
            font-size: 1.1rem; /* 调大字号 */
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-md);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .export-btn:hover {
            background: linear-gradient(135deg, #06b6d4 0%, var(--success-color) 100%);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .export-btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }
        
        .export-btn:disabled {
            background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.8;
            color: var(--bg-primary);
        }
        
        .export-btn::before {
            content: "📸";
            font-size: 1.3rem; /* 调大图标 */
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.8));
        }

        /* 提示弹窗样式 */
        .toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            padding: 15px 30px; /* 加大弹窗 */
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            font-weight: 600;
            font-size: 1.1rem; /* 调大提示文字 */
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            text-shadow: 0 0 4px rgba(0,0,0,0.3);
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 新增：彩绘图片样式 */
        .livery-image {
            width: 180px;    /* 图片宽度 */
            height: 100px;   /* 图片高度 */
            object-fit: cover; /* 保持比例裁剪 */
            border-radius: var(--radius-sm);
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            /* 关键：禁用图片跨域检测（解决渲染乱码） */
            crossOrigin: 'anonymous';
        }
        
        .livery-image:hover {
            transform: scale(1.05); /* 悬停放大 */
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        
        .no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 180px;
            height: 100px;
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            border: 2px dashed var(--border-color);
            color: var(--text-tertiary);
            font-size: 14px;
            text-align: center;
            line-height: 1.4;
        }

        /* 新增：文件名复制备用弹窗 */
        .filename-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: var(--radius-md);
            padding: 24px 32px;
            box-shadow: var(--shadow-lg);
            z-index: 9999;
            text-align: center;
        }
        .filename-popup p {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        .filename-popup .filename-text {
            font-weight: 700;
            color: var(--accent-primary);
            background: var(--highlight-bg);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: inline-block;
        }
        .filename-popup button {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }
        .filename-popup button:hover {
            background: var(--accent-secondary);
        }

        /* 新增：截图时隐藏原始数据卡片的样式 */
        .hide-for-screenshot {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <header id="mainHeader">
        <h1>二流人预警系统<span class="date-suffix"></span></h1>
        <p class="subtitle">juanxukuai_77 | 专业航班彩绘识别</p>

    <!-- 给原始数据卡片添加ID，用于截图时隐藏 -->

</div>

    let searchDictionary = [];

    function parseConfig() {
        searchDictionary = [];
        const lines = KEYWORDS_CONFIG.split('\n');
        lines.forEach(line => {
            line = line.trim();
            if (!line) return;
            const firstSpaceIndex = line.indexOf(' ');
            let key = '';
            let label = '';

            if (firstSpaceIndex === -1) {
                key = line;
            } else {
                key = line.substring(0, firstSpaceIndex);
                label = line.substring(firstSpaceIndex + 1).trim();
            }
            
            searchDictionary.push({ key: key, label: label });
        });
        console.log(`Loaded ${searchDictionary.length} keywords.`);
    }

    function processData() {
        const rawText = dataInput.value;
        const lines = rawText.split('\n');
        let matchedRows = [];

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            const parts = line.split(/\s+/);
            const rowStr = line.toUpperCase();
            let matches = [];
            
            searchDictionary.forEach(item => {
                if (rowStr.includes(item.key.toUpperCase())) {
                    matches.push(item);
                }
            });

            if (matches.length > 0) {
                matchedRows.push({
                    flight: parts[0] || '-',
                    tail: parts[1] || '-',
                    type: parts[2] || '-',
                    matches: matches
                });
            }
        });

        renderTable(matchedRows);
        exportImageBtn.disabled = matchedRows.length === 0;
    }

    function renderTable(data) {
        resultCount.innerText = `${data.length} 条`;

        if (data.length === 0) {
            tableWrapper.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 4rem; margin-bottom: 20px;">✈</div>
                    <div style="font-size: 1.3rem; margin-bottom: 10px; font-weight: 600;">没有匹配到任何内置的机号或机型</div>
                    <div style="font-size: 1.1rem; color: var(--text-tertiary); font-weight: 500;">请粘贴包含航班号、机号或机型的原始数据</div>
                </div>
            `;
            return;
        }

        let html = `
            <table class="result-table">
                <thead>
                    <tr>
                        <th style="width:15%">航班号</th>
                        <th style="width:15%">机号</th>
                        <th style="width:15%">机型</th>
                        <th style="width:25%">彩绘</th>
                        <th style="width:30%">彩绘图片</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.forEach(row => {
            const hitKeys = row.matches.map(m => m.key);
            const tailNumber = row.tail.toUpperCase();
            
            let notesHtml = '';
            row.matches.forEach(m => {
                if (m.label) {
                    notesHtml += `<span class="livery-tag">${m.label}</span>`;
                }
            });

            let imageHtml = getLiveryImageHtml(tailNumber);

            html += `
                <tr>
                    <td>${highlightKeys(row.flight, hitKeys)}</td>
                    <td>${highlightKeys(row.tail, hitKeys)}</td>
                    <td>${highlightKeys(row.type, hitKeys)}</td>
                    <td>${notesHtml || '-'}</td>
                    <td>${imageHtml}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        tableWrapper.innerHTML = html;
    }

    // 修复：图片加载优化（解决乱码）
    function getLiveryImageHtml(tailNumber) {
        if (!tailNumber || tailNumber === '-' || !IMAGE_MAPPING[tailNumber]) {
            return `<div class="no-image">-</div>`;
        }

        // 关键：添加crossorigin属性，解决跨域渲染乱码
        return `<img src="${IMAGE_MAPPING[tailNumber]}" alt="注册号${tailNumber}的图片" class="livery-image" 
                crossorigin="anonymous"
                onerror="this.onerror=null; this.parentNode.innerHTML='<div class=no-image>欢迎投搞</div>'">`;
    }

    function highlightKeys(text, keys) {
        if (!text) return '-';
        let result = text;
        
        keys.forEach(key => {
            const regex = new RegExp(`(${escapeRegExp(key)})`, 'gi');
            result = result.replace(regex, '<span class="highlight">$1</span>');
        });
        return result;
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
    }

    // 修复：导出函数（移除原始数据框 + 提升分辨率）
    async function exportTableAsImage() {
        // 禁用按钮
        exportImageBtn.innerHTML = "📸 导出中...";
        exportImageBtn.disabled = true;

        try {
            // 1. 截图前隐藏原始数据卡片
            dataCard.classList.add('hide-for-screenshot');

            // 核心优化：解决图片跨域渲染问题
            const targetElement = document.querySelector('.container');
            
            // 预处理图片：将图片转为base64（彻底解决跨域渲染乱码）
            await preprocessImagesForExport();

            // 2. 大幅提升导出分辨率：scale设为4，DPI设为600（印刷级）
            const canvas = await html2canvas(targetElement, {
                scale: 4, // 从3提升到4，大幅提高分辨率
                useCORS: true,
                backgroundColor: '#f8fafc',
                logging: false,
                allowTaint: true,
                letterRendering: true,
                dpi: 600, // 从300提升到600，超高清分辨率
                imageTimeout: 15000, // 延长图片加载超时时间
                // 关键：强制渲染所有元素，包括图片
                ignoreElements: (el) => {
                    return el.tagName === 'TEXTAREA' || el.id === 'exportImageBtn';
                },
                // 修复：等待图片加载完成再截图
                async onclone(clonedDoc) {
                    const images = clonedDoc.querySelectorAll('.livery-image');
                    for (const img of images) {
                        await new Promise((resolve) => {
                            if (img.complete) resolve();
                            img.onload = resolve;
                            img.onerror = resolve;
                        });
                    }
                    // 在克隆文档中也隐藏原始数据卡片
                    const clonedDataCard = clonedDoc.getElementById('dataCard');
                    if (clonedDataCard) {
                        clonedDataCard.classList.add('hide-for-screenshot');
                    }
                }
            });

            // 转换为Blob并下载（HFS环境下更稳定）
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = exportFileName;
                link.click();
                
                // 清理资源
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                }, 1000);

                // 修复：文件名复制（兼容本地/HFS环境）
                copyFileNameFallback(exportFileNameWithoutSuffix);

            }, 'image/png', 1.0); // 画质设为1.0（无损）

        } catch (error) {
            console.error('导出失败:', error);
            
            // 降级方案：使用toDataURL
            try {
                const targetElement = document.querySelector('.container');
                await preprocessImagesForExport();
                const canvas = await html2canvas(targetElement, {
                    scale: 3.5, // 降级仍保持超高分辨率
                    useCORS: true,
                    backgroundColor: '#f8fafc',
                    allowTaint: true,
                    dpi: 600
                });
                
                const dataUrl = canvas.toDataURL('image/png', 1.0); // 无损画质
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = exportFileName;
                link.click();
                
                copyFileNameFallback(exportFileNameWithoutSuffix);
                showToast('降级导出成功！图片已保存');
            } catch (fallbackError) {
                console.error('降级方案也失败:', fallbackError);
                showToast('导出失败！请使用浏览器截图功能手动保存');
            }
        } finally {
            // 恢复原始数据卡片显示
            dataCard.classList.remove('hide-for-screenshot');
            // 恢复按钮
            exportImageBtn.innerHTML = "📸 导出图片";
            exportImageBtn.disabled = false;
        }
    }

    // 辅助：预处理图片为base64（彻底解决跨域渲染乱码）
    async function preprocessImagesForExport() {
        const images = document.querySelectorAll('.livery-image');
        for (const img of images) {
            if (img.src && !img.src.startsWith('data:')) {
                try {
                    const base64 = await convertImageToBase64(img.src);
                    img.src = base64;
                } catch (e) {
                    console.warn('图片转base64失败:', e);
                }
            }
        }
    }

    // 辅助：图片转base64（同步提升图片分辨率）
    function convertImageToBase64(url) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width * 3; // 图片分辨率提升3倍
                canvas.height = img.height * 3;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/png', 1.0));
            };
            img.onerror = reject;
            img.src = url;
        });
    }

    // 修复：文件名复制（备用方案，兼容所有环境）
    function copyFileNameFallback(filename) {
        try {
            // 优先尝试剪贴板
            navigator.clipboard.writeText(filename);
            showToast(`导出成功！文件名 "${filename}" 已复制`);
        } catch (err) {
            // 备用：弹出弹窗显示文件名，手动复制
            const popup = document.createElement('div');
            popup.className = 'filename-popup';
            popup.innerHTML = `
                <p>导出成功！文件名：</p>
                <div class="filename-text">${filename}</div>
                <button onclick="this.parentElement.remove()">确认</button>
            `;
            document.body.appendChild(popup);
            showToast('导出成功！文件名已弹窗显示（请手动复制）');
        }
    }

    // 显示提示弹窗
    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }
</script>

</body>
</html>
