<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>本地自检（不上传 GitHub）</title>
<script>
window.supabase = {
  createClient: () => ({
    auth: {
      signInWithPassword: () => Promise.resolve({error: null}),
      signUp:             () => Promise.resolve({error: null}),
      signOut:            () => { window.__loggedOut = true; return Promise.resolve() },
      updateUser:         () => Promise.resolve({error: null}),
      getUser:            () => Promise.resolve({data: {user: {id:'u1', email:'3678163357@qq.com'}}}),
      onAuthStateChange:  () => {}
    },
    from: (table) => ({
      select: (cols) => ({
        eq: () => ({
          single: () => {
            if (table === 'admins') return Promise.resolve({data: {user_id:'u1'}, error:null})
            if (table === 'site_announcement') return Promise.resolve({data: {content:'【本地测试公告】欢迎使用！管理员可在右上角编辑公告。'}, error:null})
            if (table === 'flight_data') return Promise.resolve({data: {content:'【测试航班】CA1234 北京→成都 10:30'}, error:null})
            if (table === 'user_settings') return Promise.resolve({data: {aircraft_types:['B737','A320']}, error:null})
            return Promise.resolve({data:null, error:null})
          }
        })
      }),
      insert: (row) => { console.log('[模拟] insert', JSON.stringify(row)); return Promise.resolve({}) },
      upsert: (row) => { console.log('[模拟] upsert', JSON.stringify(row)); return Promise.resolve({}) },
      update: (row) => { console.log('[模拟] update', JSON.stringify(row)); return { eq: () => Promise.resolve({error:null}) } }
    }),
    channel: (name) => ({ on: () => ({ subscribe: () => {} }) })
  })
}
</script>
<script src="config.js"></script>
<script>window.supabaseClient = window.supabase</script>
<script src="auth.js"></script>
<link rel="stylesheet" href="style-auth.css">
<style>body{font-family:sans-serif;padding:20px;}.tip{color:#8a8a8a;font-size:.85rem;}pre{background:#f4f4f4;padding:12px;border-radius:8px;overflow:auto;}</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <div class="login-header"><span class="logo-icon">✈️</span><h2>二流人预警</h2><p>请登录后使用系统</p></div>
    <div class="login-form">
      <input type="email" id="login-email" value="3678163357@qq.com">
      <input type="password" id="login-password" value="123456">
      <div class="login-msg" id="login-message"></div>
      <button class="login-btn" onclick="return handleAuth()">登录</button>
    </div>
  </div>
</div>

<div id="app-content" style="display:none; margin-top:80px;">
  <!-- 左上角按钮组 -->
  <div id="userBar" style="position:static;margin-bottom:16px;">
    <button class="user-avatar-btn" onclick="return openProfile()"><span id="userAvatarText">U</span></button>
    <div class="author-dropdown">
      <button class="author-btn" onclick="return toggleAuthorMenu()">关于作者 <span class="caret">▾</span></button>
      <div class="author-menu" id="authorMenu">
        <a href="https://xhslink.cn/o/7Lb3ao1166Q" target="_blank" onclick="return closeAuthorMenu()"><span class="author-icon">📕</span> 小红书</a>
        <a href="https://b23.tv/JzeTBk4" target="_blank" onclick="return closeAuthorMenu()"><span class="author-icon">📺</span> 哔哩哔哩</a>
      </div>
    </div>
    <span class="tip">← 点"关于作者"展开下拉</span>
  </div>

  <!-- 管理员公告按钮 -->
  <button id="admin-announce-btn" class="admin-announce-btn" onclick="return openAnnounceEditor()" style="display:inline-block;">📢 编辑公告</button>

  <!-- 航班信息区 -->
  <div class="flight-info-section">
    <h3>✈️ 航班信息</h3>
    <p class="desc">管理员输入的内容会自动同步给所有用户。</p>
    <textarea id="flight-info-display" rows="3">【测试航班】CA1234 北京→成都 10:30</textarea>
    <div class="flight-actions">
      <button class="ghost-btn" onclick="return saveFlightLocal()">💾 保存</button>
      <span class="flight-status" id="flight-status"></span>
    </div>
    <div id="flight-info-input-wrap" style="display:block; margin-top:14px; padding-top:14px; border-top:1px dashed #d4a574;">
      <label>👑 管理员同步区（保存后全员自动更新）</label>
      <textarea id="flight-info-input" rows="3">【测试航班】CA1234 北京→成都 10:30</textarea>
      <div class="flight-actions">
        <button class="primary-btn" onclick="return saveFlightData()">🚀 保存并同步全员</button>
      </div>
    </div>
  </div>

  <!-- 每日公告 -->
  <div id="daily-announce" style="display:none;">
    <div class="announce-card">
      <button class="announce-close" onclick="return closeDailyAnnounce()">✕</button>
      <div class="announce-badge">📢 公告</div>
      <div class="announce-body" id="daily-announce-text"></div>
      <button class="announce-ok primary-btn" onclick="return closeDailyAnnounce()">我知道了</button>
    </div>
  </div>

  <!-- 管理员公告编辑窗口 -->
  <div id="announce-editor" style="display:none;">
    <div class="announce-editor-card">
      <button class="announce-close" onclick="return closeAnnounceEditor()">✕</button>
      <h3>编辑全局公告</h3>
      <p class="desc">填了内容 → 所有用户每日首次登录会弹出；留空 → 不弹。</p>
      <textarea id="announce-input" rows="5"></textarea>
      <div class="announce-editor-actions">
        <button class="ghost-btn" onclick="return closeAnnounceEditor()">取消</button>
        <button class="primary-btn" onclick="return saveAnnouncement()">保存并生效</button>
      </div>
    </div>
  </div>

  <!-- 个人中心 -->
  <div id="profileOverlay" style="display:none;">
    <div class="profile-card">
      <button class="profile-close" onclick="return closeProfile()">✕</button>
      <h2>个人中心</h2>
      <div class="profile-section"><label>邮箱</label><input type="email" id="profileEmail" disabled></div>
      <div class="profile-section">
        <label>修改密码</label>
        <input type="password" id="profileNewPassword" placeholder="新密码（至少6位）">
        <button class="primary-btn" onclick="return updatePassword()">更新密码</button>
        <div class="profile-msg" id="profileMsg"></div>
      </div>
      <button class="logout-full-btn" onclick="return logout()">退出登录</button>
    </div>
  </div>
</div>

<script>
window.addEventListener('load', () => {
  const ok = window.supabaseClient
    && typeof handleAuth === 'function'
    && typeof checkAdmin === 'function'
    && typeof saveFlightData === 'function'
    && typeof saveFlightLocal === 'function'
    && typeof saveAnnouncement === 'function'
    && typeof subscribeFlightUpdates === 'function'
    && typeof loadFlightData === 'function'
    && typeof toggleAuthorMenu === 'function'

  const r = document.createElement('div')
  r.innerHTML = `<h3 style="color:${ok?'green':'red'}">${ok?'✅ 全部就绪':'❌ 有问题'}</h3>
    <ol>
      <li>点"登录"（默认 3678163357@qq.com = 管理员）→ 不跳转</li>
      <li>右上角应显示"📢 编辑公告"按钮（仅管理员可见）</li>
      <li>点"📢 编辑公告" → 弹出编辑窗口，可改公告内容</li>
      <li>航班信息区：管理员同步区输入内容 → 点"🚀 保存并同步全员"</li>
      <li>普通用户：在上方框输入 → 点"💾 保存" → 只存本地，不影响别人</li>
      <li>每日公告应自动弹出（清 localStorage 后可重测）</li>
    </ol>
    <p class="tip">Console 试：<code>isAdmin</code>（查看当前是否管理员）、<code>saveAnnouncement("新公告")</code></p>`
  document.body.appendChild(r)
})
</script>
</body>
</html>
