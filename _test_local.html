<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>本地自检（不上传 GitHub）</title>
<script>
window.supabase = {
  createClient: () => ({
    auth: {
      signInWithPassword: () => Promise.resolve({error: null}),
      signUp:             () => Promise.resolve({error: null}),
      signOut:            () => { window.__loggedOut = true; return Promise.resolve() },
      updateUser:         () => Promise.resolve({error: null}),
      getUser:            () => Promise.resolve({data: {user: {id:'u1', email:'3678163357@qq.com'}}}),
      onAuthStateChange:  () => {}
    },
    from: (table) => ({
      select: (cols) => ({
        eq: () => ({
          single: () => {
            if (table === 'admins') return Promise.resolve({data: {user_id:'u1'}, error:null})
            if (table === 'site_announcement') return Promise.resolve({data: {content:'【本地测试公告】欢迎使用！管理员可在右上角编辑公告。'}, error:null})
            if (table === 'flight_data') return Promise.resolve({data: {id:1, today:'【今日航班】CA1234 北京→成都 10:30', tomorrow:'【明日航班】MU5678 上海→广州 14:20', content:''}, error:null})
            if (table === 'user_settings') return Promise.resolve({data: {aircraft_types:['B737','A320']}, error:null})
            return Promise.resolve({data:null, error:null})
          }
        })
      }),
      insert: (row) => { console.log('[模拟] insert', JSON.stringify(row)); return Promise.resolve({}) },
      upsert: (row) => { console.log('[模拟] upsert', JSON.stringify(row)); return Promise.resolve({}) },
      update: (row) => { console.log('[模拟] update', JSON.stringify(row)); return { eq: () => Promise.resolve({error:null}) } }
    }),
    channel: (name) => ({ on: () => ({ subscribe: () => {} }) })
  })
}
</script>
<script src="config.js"></script>
<script>window.supabaseClient = window.supabase</script>
<script src="auth.js"></script>
<link rel="stylesheet" href="style-auth.css">
<style>body{font-family:sans-serif;padding:20px;}.tip{color:#8a8a8a;font-size:.85rem;}pre{background:#f4f4f4;padding:12px;border-radius:8px;overflow:auto;}</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <div class="login-header"><span class="logo-icon">✈️</span><h2>二流人预警</h2><p>请登录后使用系统</p></div>
    <div class="login-form">
      <input type="email" id="login-email" value="3678163357@qq.com">
      <input type="password" id="login-password" value="123456">
      <div class="login-msg" id="login-message"></div>
      <button class="login-btn" onclick="return handleAuth()">登录</button>
    </div>
  </div>
</div>

<div id="app-content" style="display:none; margin-top:80px;">
  <!-- 固定顶部栏 -->
  <header id="topbar" class="topbar" style="position:static; margin:-80px -20px 20px; border-radius:0;">
    <div class="topbar__brand">
      <span class="topbar__logo">✈️</span>
      <div class="topbar__title-wrap">
        <span class="topbar__title">二流人预警</span>
        <span class="topbar__sub">juanxukuai_77 · 航班彩绘识别</span>
      </div>
    </div>
    <div class="topbar__actions">
      <div class="author-dropdown">
        <button class="author-btn" onclick="return toggleAuthorMenu()">关于作者 <span class="caret">▾</span></button>
        <div class="author-menu" id="authorMenu">
          <a href="https://xhslink.cn/o/7Lb3ao1166Q" target="_blank" onclick="return closeAuthorMenu()"><span class="author-icon">📕</span> 小红书</a>
          <a href="https://b23.tv/JzeTBk4" target="_blank" onclick="return closeAuthorMenu()"><span class="author-icon">📺</span> 哔哩哔哩</a>
        </div>
      </div>
      <button id="admin-announce-btn" class="admin-announce-btn" onclick="return openAnnounceEditor()" style="display:inline-block;">📢 公告</button>
      <button class="user-avatar-btn" id="userAvatarBtn" onclick="return openProfile()" title="个人中心" aria-label="个人中心">
        <svg class="avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8.5" r="4"></circle>
          <path d="M4.5 20.5c1.4-4 4.3-6 7.5-6s6.1 2 7.5 6"></path>
        </svg>
      </button>
    </div>
  </header>

  <p class="tip">固定顶部栏已渲染：左侧品牌 + 关于作者 + 简笔人头像。</p>

  <!-- 今日 / 明日 切换 -->
  <div id="dayTabs" style="display:flex; gap:10px; margin-bottom:16px;">
    <button class="day-tab active" data-day="today" onclick="return switchDay('today')">🟢 今日</button>
    <button class="day-tab" data-day="tomorrow" onclick="return switchDay('tomorrow')">🔵 明日</button>
  </div>

  <!-- 原始数据区：共用同一框 -->
  <div class="flight-info-section" style="border:1px solid #d4cfc7; border-radius:10px; padding:18px; background:#f7f5f0;">
    <h3>✈️ 原始数据</h3>
    <p class="desc">管理员与普通用户共用同一框：管理员编辑后点"同步给所有用户"才推送；普通用户点"同步管理员数据"拉取。</p>
    <textarea id="flight-info-display" rows="3" style="width:100%;">【测试航班】CA1234 北京→成都 10:30</textarea>
    <div class="flight-actions" style="display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap;">
      <button class="btn btn-ghost" onclick="return saveFlightLocal()">💾 保存本地</button>
      <button id="sync-btn" class="btn btn-sync" onclick="return syncFlightData()">🚀 同步给所有用户</button>
      <button id="pull-btn" class="btn btn-primary" onclick="return pullFlightData()">🔄 同步管理员数据</button>
      <span class="flight-status" id="flight-status"></span>
    </div>
  </div>

  <!-- 每日公告 -->
  <div id="daily-announce" style="display:none;">
    <div class="announce-overlay"></div>
    <div class="announce-card">
      <div class="announce-badge">📢 公告</div>
      <div class="announce-body" id="daily-announce-text"></div>
      <button class="announce-ok btn btn-primary" onclick="return closeDailyAnnounce()">我知道了</button>
    </div>
  </div>

  <!-- 管理员公告编辑窗口 -->
  <div id="announce-editor" style="display:none;">
    <div class="announce-editor-card">
      <button class="announce-close" onclick="return closeAnnounceEditor()">✕</button>
      <h3>编辑全局公告</h3>
      <p class="desc">填了内容 → 所有用户每日首次登录会弹出；留空 → 不弹。</p>
      <textarea id="announce-input" rows="5"></textarea>
      <div class="announce-editor-actions">
        <button class="btn btn-ghost" onclick="return closeAnnounceEditor()">取消</button>
        <button class="btn btn-primary" onclick="return saveAnnouncement()">保存并生效</button>
      </div>
    </div>
  </div>

  <!-- 个人中心 -->
  <div id="profileOverlay" style="display:none;">
    <div class="profile-card">
      <button class="profile-close" onclick="return closeProfile()">✕</button>
      <h2>个人中心</h2>
      <div class="profile-section"><label>邮箱</label><input type="email" id="profileEmail" disabled></div>
      <div class="profile-section">
        <label>修改密码</label>
        <input type="password" id="profileNewPassword" placeholder="新密码（至少6位）">
        <button class="btn btn-primary" onclick="return updatePassword()">更新密码</button>
        <div class="profile-msg" id="profileMsg"></div>
      </div>
      <button class="logout-full-btn" onclick="return logout()">退出登录</button>
    </div>
  </div>
</div>

<script>
window.addEventListener('load', () => {
  const ok =
    window.supabaseClient &&
    typeof handleAuth === 'function' &&
    typeof checkAdmin === 'function' &&
    typeof syncFlightData === 'function' &&
    typeof pullFlightData === 'function' &&
    typeof saveFlightLocal === 'function' &&
    typeof saveAnnouncement === 'function' &&
    typeof loadFlightData === 'function' &&
    typeof switchFlightDay === 'function' &&
    typeof switchDay === 'function' &&
    typeof pickDayContent === 'function' &&
    document.querySelector('.topbar') &&
    document.querySelector('.avatar-icon') &&
    document.querySelector('.day-tab[data-day="tomorrow"]')

  const r = document.createElement('div')
  r.innerHTML = `<h3 style="color:${ok?'green':'red'}">${ok?'✅ 全部就绪':'❌ 有问题'}</h3>
    <ol>
      <li>顶部栏应显示：品牌 + 关于作者 + 简笔人头像</li>
      <li>点"登录"（3678163357@qq.com = 管理员）→ 不跳转</li>
      <li>应显示"📢 公告"按钮（仅管理员可见）</li>
      <li>有"🟢 今日 / 🔵 明日"两个 Tab，可互相切换</li>
      <li>管理员：框内编辑 → 点"🚀 同步给所有用户"才推送</li>
      <li>普通用户：点"🔄 同步管理员数据"拉取；有本地副本则保留</li>
      <li>今日 / 明日数据独立保存、分别同步</li>
      <li>每日公告应自动弹出（虚化背景、居中大卡片）</li>
    </ol>
    <p class="tip">Console 试：<code>isAdmin</code>、<code>window.getCurrentDay()</code></p>`
  document.body.appendChild(r)
})
</script>
</body>
</html>
