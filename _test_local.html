<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>本地自检（不上传 GitHub）</title>
<!-- 模拟 Supabase CDN，无需真实后端即可验证 UI 与逻辑不报错、不跳转 -->
<script>
window.supabase = {
  createClient: () => ({
    auth: {
      signInWithPassword: ({email}) => Promise.resolve({error: null}),
      signUp:             ({email}) => Promise.resolve({error: null}),
      getUser:            () => Promise.resolve({data: {user: {id:'u1', email:'test@test.com'}}}),
      signOut:            () => Promise.resolve(),
      onAuthStateChange:  () => {}
    },
    from: (table) => ({
      // 预置一条记录，模拟"老用户已有配置"
      select: () => ({eq: () => ({single: () => Promise.resolve({data: {aircraft_types:['B737','A320']}, error: null})})}),
      insert: (row) => { log('[模拟] insert '+table, row); return Promise.resolve({}) },
      upsert: (row) => { log('[模拟] upsert '+table, row); return Promise.resolve({}) }
    })
  })
}
function log(t, d){ console.log(t, JSON.stringify(d)) }
</script>
<script src="config.js"></script>
<script src="auth.js"></script>
<link rel="stylesheet" href="style-auth.css">
<style>body{font-family:sans-serif;padding:20px;}#app-content{margin-top:20px;}</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <div class="login-header"><span class="logo-icon">✈️</span><h2 id="login-title">二流人预警</h2><p>请登录后使用系统</p></div>
    <div class="login-form">
      <input type="email" id="login-email" value="test@test.com">
      <input type="password" id="login-password" value="123456">
      <div class="login-msg" id="login-message"></div>
      <button type="button" class="login-btn" id="login-submit" onclick="return handleAuth()">登录</button>
      <button type="button" class="login-toggle" id="login-toggle" onclick="return toggleMode()">没有账号？去注册</button>
    </div>
  </div>
</div>

<button id="logoutBtn" onclick="return logout()">退出</button>

<div id="app-content" style="display:none;">
  <button class="settings-btn" onclick="return toggleSettings()">⚙️ 我的筛选机型</button>
  <div class="settings-panel" id="settingsPanel">
    <h3>自定义筛选机型</h3>
    <p class="desc">添加机型代码，系统自动保存</p>
    <div class="settings-add">
      <input type="text" id="newTypeInput" placeholder="如 B737" onkeydown="if(event.key==='Enter'){addAircraftType();return false;}">
      <button onclick="return addAircraftType()">添加</button>
    </div>
    <div class="type-tags" id="typeTags"></div>
    <div class="settings-status" id="settingsStatus"></div>
  </div>
  <p>当前筛选机型（window.userAircraftTypes）：<span id="curTypes"></span></p>
</div>

<script>
// 主页面默认值导出（与 index.html 一致）
window.DEFAULT_AIRCRAFT_TYPES = ['B737','A320','C919']

// 实时显示当前机型
setInterval(() => {
  document.getElementById('curTypes').textContent = (window.userAircraftTypes || []).join(', ')
}, 400)

window.addEventListener('load', () => {
  const ok = window.supabaseClient
    && typeof handleAuth === 'function'
    && typeof toggleSettings === 'function'
    && typeof addAircraftType === 'function'
    && typeof saveUserSettings === 'function'
  const r = document.createElement('div')
  r.innerHTML = `<h3 style="color:${ok?'green':'red'}">${ok?'✅ 全部就绪':'❌ 有问题'}</h3>
    <ol>
      <li>点"登录" → <b>不跳转</b>，提示登录成功/模拟</li>
      <li>登录后自动加载机型 → 右上"当前筛选机型"显示 B737,A320</li>
      <li>点"⚙️ 我的筛选机型" → 输入 C919 点添加 → 显示"✅ 已保存"</li>
      <li>F12 Console 里看 [模拟] upsert user_settings {...} 即代表已写入"数据库"</li>
    </ol>
    <p style="color:#8a8a8a;font-size:.85rem">提示：本页只做本地验证，不会真连 Supabase。</p>`
  document.body.appendChild(r)
})
</script>
</body>
</html>
